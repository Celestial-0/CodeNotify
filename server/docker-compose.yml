name: codenotify-server

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_REPO_OWNER:-celestial-0}/codenotify-server:${IMAGE_TAG:-latest}
    container_name: codenotify-server
    restart: unless-stopped
    ports:
      - "${PORT:-3999}:3999"
    env_file:
      - .env
    environment:
      - PORT=3999
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3999/health').then(r => {if (r.status !== 200) process.exit(1)}).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - codenotify
    labels:
      - "app=codenotify"
      - "component=server"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  codenotify:
    driver: bridge
